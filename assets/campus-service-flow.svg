<text x="1150" y="227" font-size="17" fill="#36556b" font-weight="400" text-anchor="middle">웹 · 메일 · 연구 파일</text>
<path d="M290 190H462" fill="none" stroke="#597c94" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="375" y="181" font-size="16" fill="#36556b" font-weight="400" text-anchor="middle">① DNS 질의</text>
<path d="M470 233H298" fill="none" stroke="#597c94" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="375" y="225" font-size="16" fill="#36556b" font-weight="400" text-anchor="middle">② 주소 응답</text>
