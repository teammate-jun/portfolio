<rect x="36" y="570" width="1288" height="195" rx="18" fill="#ffffff" stroke="#d5e0e8"/>
<text x="58" y="606" font-size="23" fill="#193c52" font-weight="700" text-anchor="start">03  웹메일 화면과 메일함</text>
