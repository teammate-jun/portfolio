<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1494" viewBox="0 0 1360 1494" role="img" aria-labelledby="title desc">
<title id="title">대학 서비스 요청 흐름</title>
<desc id="desc">DNS 질의와 주소 응답 후 사용자가 각 서비스에 직접 접속함. 학사 웹은 LB·웹 서버·앱 서버·학사 DB 순서로 연결됨. PH의 Roundcube는 MAIL01에 SMTP·IMAP으로 접속함. 외부 메일은 VIP 25번에서 MAIL01 2525번으로 전달됨. Amavis·ClamAV 검사 후 정상 메일은 10025번으로 재주입한 뒤 Dovecot으로 배달하며, 탐지 메일은 격리·폐기함. ownCloud는 별도 DB03, Pydio는 서버 내부 MariaDB와 연결됨.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#597c94"/></marker></defs>
<rect width="1360" height="1494" fill="#f3f6fa"/>
<g font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
<text x="44" y="51" font-size="33" fill="#173a50" font-weight="700" text-anchor="start">대학 서비스 요청 흐름</text>
<text x="44" y="84" font-size="18" fill="#526d81" font-weight="400" text-anchor="start">서버 구성과 통신 경로 · DNS 조회, 웹 요청, 메일 검사, 연구 파일 서비스</text>
<rect x="36" y="110" width="1288" height="192" rx="18" fill="#ffffff" stroke="#d5e0e8"/>
<text x="58" y="146" font-size="23" fill="#193c52" font-weight="700" text-anchor="start">01  DNS 조회와 서비스 접속</text>
<rect x="60" y="170" width="230" height="78" rx="12" fill="#ffffff" stroke="#becdd8" stroke-width="1.5"/>
<text x="175" y="201" font-size="21" fill="#193c52" font-weight="700" text-anchor="middle">사용자</text>
<text x="175" y="227" font-size="17" fill="#36556b" font-weight="400" text-anchor="middle">이름으로 서비스 조회</text>
<rect x="470" y="170" width="290" height="78" rx="12" fill="#edf4fa" stroke="#8facbf" stroke-width="1.5"/>
<text x="615" y="201" font-size="21" fill="#193c52" font-weight="700" text-anchor="middle">DNS01 · DMZ</text>
<text x="615" y="227" font-size="17" fill="#36556b" font-weight="400" text-anchor="middle">DNS 이름 해석</text>
<rect x="1010" y="170" width="280" height="78" rx="12" fill="#edf4fa" stroke="#8facbf" stroke-width="1.5"/>
