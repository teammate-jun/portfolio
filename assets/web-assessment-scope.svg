<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="852" viewBox="0 0 1200 852" role="img" aria-labelledby="title desc">
  <title id="title">쇼핑몰 보안 점검 범위</title>
  <desc id="desc">VulnMart 쇼핑몰과 연계 DB를 대상으로 한 네 가지 독립 시나리오의 입력 지점과 점검 범위. 로그인·검색 SQL Injection, 저장형 콘텐츠·피싱 시나리오, 프로필 파일 업로드, 반복 인증으로 구분함.</desc>
  <g font-family="Malgun Gothic, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
    <rect width="1200" height="852" rx="20" fill="#f3f6f9"/>
    <text x="42" y="48" font-size="15" fill="#487285" font-weight="700">WEB SECURITY / ASSESSMENT SCOPE</text>
    <text x="42" y="96" font-size="34" fill="#16364b" font-weight="700">쇼핑몰 보안 점검 범위</text>
    <text x="42" y="132" font-size="19" fill="#52677b">VulnMart · GNS3 격리 네트워크 · 입력점별 네 가지 시나리오</text>

    <rect x="32" y="164" width="552" height="154" rx="14" fill="#ffffff" stroke="#d5e0e8"/>
    <rect x="604" y="164" width="564" height="154" rx="14" fill="#ffffff" stroke="#d5e0e8"/>
    <text x="56" y="198" font-size="17" fill="#28736b" font-weight="700">대상 서비스</text>
    <text x="56" y="233" font-size="24" fill="#16364b" font-weight="700">VulnMart 쇼핑몰 · 연계 DB</text>
    <text x="56" y="265" font-size="20" fill="#334b5d">nginx · PHP-FPM · MariaDB</text>
    <text x="56" y="294" font-size="18" fill="#52677b">GNS3 격리 네트워크</text>
    <text x="628" y="198" font-size="17" fill="#28736b" font-weight="700">검증 조건</text>
    <text x="628" y="234" font-size="20" fill="#334b5d">테스트 계정 · 가상 회원·주문·결제 데이터</text>
    <text x="628" y="265" font-size="20" fill="#334b5d">블랙박스 점검</text>
    <text x="628" y="294" font-size="18" fill="#52677b">일부 단계에 계정·세션·실행 조건 지정</text>

    <text x="56" y="365" font-size="17" fill="#52677b" font-weight="700">시나리오</text>
    <text x="398" y="365" font-size="17" fill="#52677b" font-weight="700">입력 지점</text>
    <text x="766" y="365" font-size="17" fill="#52677b" font-weight="700">점검 범위</text>

    <rect x="32" y="384" width="1136" height="86" rx="12" fill="#ffffff" stroke="#d5e0e8"/>
    <rect x="48" y="405" width="42" height="42" rx="10" fill="#e5efed"/>
    <text x="69" y="433" font-size="18" fill="#28736b" text-anchor="middle" font-weight="700">01</text>
    <text x="108" y="435" font-size="22" fill="#16364b" font-weight="700">SQL Injection</text>
    <text x="398" y="435" font-size="21" fill="#334b5d">로그인 · 상품 검색</text>
    <text x="766" y="435" font-size="20" fill="#334b5d">인증 처리 · DB 조회</text>

    <rect x="32" y="486" width="1136" height="86" rx="12" fill="#ffffff" stroke="#d5e0e8"/>
    <rect x="48" y="507" width="42" height="42" rx="10" fill="#e5efed"/>
    <text x="69" y="535" font-size="18" fill="#28736b" text-anchor="middle" font-weight="700">02</text>
    <text x="108" y="537" font-size="22" fill="#16364b" font-weight="700">저장형 콘텐츠 · 피싱</text>
    <text x="398" y="537" font-size="21" fill="#334b5d">후기 · 게시글 · 쿠폰 링크</text>
    <text x="766" y="520" font-size="20" fill="#334b5d">저장 · 재출력</text>
    <text x="766" y="549" font-size="20" fill="#334b5d">피싱 재현 페이지 이동</text>

    <rect x="32" y="588" width="1136" height="86" rx="12" fill="#ffffff" stroke="#d5e0e8"/>
    <rect x="48" y="609" width="42" height="42" rx="10" fill="#e5efed"/>
    <text x="69" y="637" font-size="18" fill="#28736b" text-anchor="middle" font-weight="700">03</text>
    <text x="108" y="639" font-size="22" fill="#16364b" font-weight="700">파일 업로드</text>
    <text x="398" y="639" font-size="21" fill="#334b5d">프로필 이미지 업로드</text>
    <text x="766" y="622" font-size="20" fill="#334b5d">파일 수용 · 저장 경로 접근</text>
    <text x="766" y="651" font-size="20" fill="#334b5d">서버 실행 조건</text>

    <rect x="32" y="690" width="1136" height="86" rx="12" fill="#ffffff" stroke="#d5e0e8"/>
    <rect x="48" y="711" width="42" height="42" rx="10" fill="#e5efed"/>
    <text x="69" y="739" font-size="18" fill="#28736b" text-anchor="middle" font-weight="700">04</text>
    <text x="108" y="741" font-size="22" fill="#16364b" font-weight="700">반복 인증</text>
    <text x="398" y="741" font-size="21" fill="#334b5d">로그인 폼</text>
    <text x="766" y="741" font-size="20" fill="#334b5d">반복 요청 · 응답 · 인증 상태</text>

    <text x="42" y="822" font-size="18" fill="#334b5d">입력 지점별로 요청·응답, 인증 상태, 데이터와 서버 실행 결과를 기록함.</text>
  </g>
</svg>
